kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: krishna-cluster
nodes:
  - role: control-plane
    image: ssh-node:v1.37.0
    extraPortMappings:
      - containerPort: 30080
        hostPort: 8080
      - containerPort: 22
        hostPort: 2222
  - role: worker
    image: ssh-node:v1.37.0
    extraPortMappings:
      - containerPort: 22
        hostPort: 2223
  - role: worker
    image: ssh-node:v1.37.0
    extraPortMappings:
      - containerPort: 22
        hostPort: 2224
  - role: worker
    image: ssh-node:v1.37.0
    extraPortMappings:
      - containerPort: 22
        hostPort: 2225
